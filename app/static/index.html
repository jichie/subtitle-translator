<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<title>Subtitle Translator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-raised: #fbfbf9;
  --surface-strong: #f0f0ec;
  --border: #e8e8e3;
  --border-strong: #deded8;
  --text: #1c1c1a;
  --text-secondary: #6b6b67;
  --text-tertiary: #9a9a94;
  --accent: #d94f3d;
  --accent-hover: #e06352;
  --accent-light: #fdf2f0;
  --success: #2a9d63;
  --warning: #e08c1e;
  --error: #d13b3b;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-card: 0 4px 12px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
body.dark {
  --bg: #141413;
  --surface: #1c1c1a;
  --surface-raised: #232320;
  --surface-strong: #2a2a26;
  --border: #2e2e2a;
  --border-strong: #3a3a35;
  --text: #f2f2ef;
  --text-secondary: #a3a39d;
  --text-tertiary: #73736d;
  --accent: #f07060;
  --accent-hover: #f58a7d;
  --accent-light: rgba(240,112,96,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button, input, textarea, select { font-family:inherit; font-size:inherit; }
button { cursor:pointer; border:none; background:none; }

/* Top bar */
.topbar {
  height:64px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; gap:16px; position:relative; z-index:20;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo-mark { width:32px; height:32px; border-radius:10px; background:var(--accent); position:relative; overflow:hidden; }
.logo-mark::after { content:''; position:absolute; inset:8px; border:2px solid #fff; border-radius:50%; border-right-color:transparent; transform:rotate(-45deg); }
.brand h1 { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
.path-control { flex:1; max-width:560px; display:flex; align-items:center; gap:8px; background:var(--surface-raised); border:1px solid var(--border); border-radius:100px; padding:4px; }
.path-control svg { width:16px; height:16px; color:var(--text-tertiary); margin-left:10px; }
.path-control input { flex:1; border:none; background:transparent; padding:6px 4px; color:var(--text); outline:none; font-size:13px; }
.path-control .btn { padding:6px 14px; border-radius:100px; color:var(--text-secondary); }
.path-control .btn:hover { background:var(--surface-strong); color:var(--text); }
.top-actions { display:flex; align-items:center; gap:8px; }
.btn { padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); font-weight:500; transition:all .15s; }
.btn:hover { background:var(--surface-raised); color:var(--text); border-color:var(--border-strong); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:#fff; }
.btn-icon { width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; }

/* Stage */
.stage { height:calc(100vh - 64px); overflow:hidden; position:relative; }
.container { max-width:1100px; margin:0 auto; height:100%; padding:28px 24px; overflow-y:auto; }

/* Dashboard */
.dashboard-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:20px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-card); }
.card-pad { padding:22px; }
.card h3 { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:16px; letter-spacing:0.02em; }
.span-8 { grid-column:span 8; }
.span-4 { grid-column:span 4; }
.span-6 { grid-column:span 6; }
.span-12 { grid-column:span 12; }
@media(max-width:900px){ .span-8,.span-4,.span-6 { grid-column:span 12; } }

.hero { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.hero-text h2 { font-size:26px; font-weight:800; letter-spacing:-0.03em; margin-bottom:6px; }
.hero-text p { color:var(--text-secondary); font-size:14px; }
.hero-action { display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.hero-action .btn { padding:10px 20px; font-size:14px; }

.quick-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.qa-item { padding:18px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-raised); cursor:pointer; transition:all .15s; text-align:left; }
.qa-item:hover { border-color:var(--accent); background:var(--accent-light); }
.qa-item .icon { width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:12px; }
.qa-item:hover .icon { background:#fff; }
.qa-item strong { display:block; font-size:13px; margin-bottom:4px; color:var(--text); }
.qa-item span { font-size:12px; color:var(--text-secondary); }

.status-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; font-size:12px; font-weight:600; background:var(--surface-strong); color:var(--text-secondary); }
.status-pill::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
.status-pill.active { background:var(--accent-light); color:var(--accent); }
.status-pill.active::before { box-shadow:0 0 0 3px rgba(217,79,61,0.15); }

/* File drawer */
.drawer { position:fixed; top:64px; left:0; width:320px; height:calc(100vh - 64px); background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform .25s ease; z-index:15; display:flex; flex-direction:column; }
.drawer.open { transform:translateX(0); }
.drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition:opacity .25s; z-index:14; }
.drawer-overlay.open { opacity:1; pointer-events:auto; }
.drawer-header { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.drawer-header h3 { font-size:14px; font-weight:700; }
.drawer-toolbar { padding:12px 18px; display:flex; gap:8px; border-bottom:1px solid var(--border); }
.sort-btn { padding:4px 12px; border-radius:100px; border:1px solid var(--border); background:var(--surface-raised); color:var(--text-secondary); font-size:12px; cursor:pointer; }
.sort-btn.active { background:var(--text); border-color:var(--text); color:var(--bg); }
.drawer-list { flex:1; overflow-y:auto; padding:8px 0; }
.f-item { display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer; color:var(--text-secondary); border-left:3px solid transparent; }
.f-item:hover { background:var(--surface-raised); color:var(--text); }
.f-item.sel { background:var(--accent-light); border-left-color:var(--accent); color:var(--text); }
.f-item svg { width:16px; height:16px; flex-shrink:0; }
.f-item .name { flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.f-item .meta { font-size:10px; color:var(--text-tertiary); }

/* Editor */
.editor-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }
.editor-header h2 { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
.editor-header p { color:var(--text-secondary); margin-top:4px; }
.tabs { display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; }
.tab { padding:10px 16px; font-size:13px; font-weight:600; color:var(--text-tertiary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

.track-card { display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); margin-bottom:10px; cursor:pointer; transition:all .15s; }
.track-card:hover { border-color:var(--border-strong); }
.track-card.selected { border-color:var(--accent); background:var(--accent-light); }
.track-card .lang { font-size:11px; font-weight:800; text-transform:uppercase; color:var(--accent); min-width:42px; }
.track-card .title { flex:1; font-size:13px; color:var(--text-secondary); }
.track-card.selected .title { color:var(--text); }
.track-card .idx { font-size:11px; color:var(--text-tertiary); }
.track-card .badge { font-size:10px; padding:3px 8px; border-radius:100px; background:var(--surface-strong); color:var(--text-secondary); font-weight:600; }

.progress-ring { width:64px; height:64px; transform:rotate(-90deg); }
.progress-ring circle { fill:none; stroke-width:6; }
.progress-ring .bg { stroke:var(--border-strong); }
.progress-ring .fg { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .3s; }
.progress-block { display:flex; align-items:center; gap:20px; padding:24px; }
.progress-info h4 { font-size:15px; font-weight:700; margin-bottom:4px; }
.progress-info p { color:var(--text-secondary); font-size:13px; }

.sample-row { display:grid; grid-template-columns:44px 1fr 1fr 110px; gap:14px; align-items:stretch; padding:14px 16px; border-bottom:1px solid var(--border); }
.sample-row:last-child { border-bottom:none; }
.sample-row .idx { font-size:11px; color:var(--text-tertiary); display:flex; align-items:center; justify-content:flex-end; }
.sample-row .src { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; line-height:1.6; }
.sample-row .dst textarea { width:100%; height:100%; min-height:54px; border:1px solid transparent; background:transparent; border-radius:6px; padding:8px; color:var(--text); resize:vertical; outline:none; line-height:1.6; }
.sample-row .dst textarea:focus { background:var(--surface-raised); border-color:var(--accent); }
.sample-row .acts { display:flex; gap:6px; align-items:center; justify-content:flex-end; }
.sample-row .acts button { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); }
.sample-row .acts button:hover { background:var(--surface-raised); color:var(--accent); }

.guide-box { font-size:14px; line-height:1.95; color:var(--text-secondary); }
.guide-box strong { color:var(--text); }
.guide-empty { text-align:center; padding:60px 20px; }
.guide-empty .big { width:72px; height:72px; border-radius:50%; background:var(--surface-strong); color:var(--text-tertiary); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }

/* History / Subscriptions / Stats */
.list-item { display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border); }
.list-item:last-child { border-bottom:none; }
.list-item .icon { width:36px; height:36px; border-radius:10px; background:var(--surface-raised); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); }
.list-item .body { flex:1; }
.list-item .title { font-size:13px; font-weight:600; color:var(--text); }
.list-item .meta { font-size:12px; color:var(--text-secondary); }
.list-item .actions { display:flex; gap:6px; }
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.stat-card { padding:20px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-raised); }
.stat-card .label { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
.stat-card .value { font-size:28px; font-weight:800; color:var(--text); letter-spacing:-0.02em; }

/* Empty state */
.empty { text-align:center; padding:80px 20px; max-width:420px; margin:0 auto; }
.empty .icon { width:80px; height:80px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; color:var(--text-tertiary); }
.empty h3 { font-size:18px; font-weight:700; margin-bottom:8px; }
.empty p { color:var(--text-secondary); margin-bottom:20px; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s; }
.modal-overlay.open { opacity:1; pointer-events:auto; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); width:92%; max-width:560px; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:16px; font-weight:700; }
.modal-body { padding:22px; overflow-y:auto; }
.modal-footer { padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.form-row { margin-bottom:16px; }
.form-row label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
.form-row input, .form-row select, .form-row textarea { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-raised); color:var(--text); outline:none; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color:var(--accent); }
.form-row input[type="checkbox"] { width:auto; }

/* Toast */
#toast-container { position:fixed; top:18px; right:18px; z-index:100; display:flex; flex-direction:column; gap:10px; }
.toast { padding:12px 18px; border-radius:var(--radius-sm); background:var(--text); color:#fff; font-size:13px; font-weight:500; box-shadow:var(--shadow-card); animation:toastIn .25s ease; }
.toast.error { background:var(--error); }
.toast.success { background:var(--success); }
.toast.warning { background:var(--warning); color:#1c1c1a; }
@keyframes toastIn { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* Logs */
.log-panel { background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; line-height:1.7; color:var(--text-secondary); max-height:320px; overflow-y:auto; white-space:pre-wrap; }

/* Toggle */
.toggle { display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-size:13px; color:var(--text-secondary); }
.toggle input { display:none; }
.toggle .track { width:38px; height:22px; background:var(--border-strong); border-radius:100px; position:relative; transition:background .2s; }
.toggle .track::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
.toggle input:checked+.track { background:var(--accent); }
.toggle input:checked+.track::after { transform:translateX(16px); }

/* Misc */
.badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; }
.badge-accent { background:var(--accent-light); color:var(--accent); }
.badge-neutral { background:var(--surface-strong); color:var(--text-secondary); }
.mt-16 { margin-top:16px; }
.flex { display:flex; }
.gap-8 { gap:8px; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"></div>
      <h1>Subtitle Translator</h1>
    </div>
    <div class="path-control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="path-input" placeholder="输入视频路径或选择文件...">
      <button class="btn" onclick="loadPath()">跳转</button>
      <button class="btn" onclick="refreshFiles()">刷新</button>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="toggleFileDrawer()">文件</button>
      <button class="btn" onclick="openBatchModal()">批量</button>
      <button class="btn btn-primary" id="btn-start" onclick="onStartClick()">开始翻译</button>
      <button class="btn btn-icon" onclick="openSettingsModal()" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <button class="btn btn-icon" onclick="toggleTheme()" title="切换主题">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="container" id="main-container"></div>
  </main>

  <aside class="drawer" id="file-drawer">
    <div class="drawer-header">
      <h3>文件浏览器</h3>
      <button class="btn btn-icon" onclick="toggleFileDrawer()">✕</button>
    </div>
    <div class="drawer-toolbar">
      <button class="sort-btn active" id="sort-name" onclick="setSort('name')">名称</button>
      <button class="sort-btn" id="sort-time" onclick="setSort('time')">时间</button>
    </div>
    <div class="drawer-list" id="file-list"></div>
  </aside>
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleFileDrawer()"></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal">
    <div class="modal-header"><h3>设置</h3><button class="btn btn-icon" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>API Base URL</label><input id="s-base-url" placeholder="https://api.openai.com/v1"></div>
      <div class="form-row"><label>API Key</label><input id="s-api-key" type="password" placeholder="sk-..."></div>
      <div class="form-row"><label>翻译模型</label><input id="s-model" placeholder="deepseek-v4-flash"></div>
      <div class="form-row"><label>上下文模型</label><input id="s-context-model" placeholder="deepseek-v4-pro"></div>
      <div class="form-row"><label>每批条数</label><input id="s-batch-size" type="number" min="1" max="100"></div>
      <div class="form-row"><label>Webhook URL</label><input id="s-webhook-url" placeholder="可选"></div>
      <div class="form-row"><label>Webhook 类型</label><select id="s-webhook-type"><option value="weecom">WeCom</option><option value="discord">Discord</option><option value="slack">Slack</option><option value="telegram">Telegram</option></select></div>
      <div class="form-row"><label><input type="checkbox" id="s-use-context"> 使用上下文感知翻译</label></div>
      <div class="form-row"><label><input type="checkbox" id="s-auto-cleanup"> 自动清理失败任务</label></div>
      <div class="form-row"><label><input type="checkbox" id="s-bilingual"> 生成双语字幕</label></div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="closeModals()">取消</button><button class="btn btn-primary" onclick="saveSettings()">保存</button></div>
  </div>
</div>

<!-- Batch Modal -->
<div class="modal-overlay" id="modal-batch">
  <div class="modal">
    <div class="modal-header"><h3>批量翻译</h3><button class="btn btn-icon" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>输入目录或包含视频/SRT 路径的列表</label><textarea id="batch-input" rows="6" placeholder="例如：&#10;/videos/Show/S01&#10;/videos/Movie.mkv"></textarea></div>
      <div class="form-row"><label>目标语言（留空使用默认）</label><input id="batch-lang" placeholder="zh"></div>
      <div class="form-row"><label><input type="checkbox" id="batch-overwrite"> 覆盖已有字幕</label></div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="closeModals()">取消</button><button class="btn btn-primary" onclick="submitBatch()">开始</button></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
const state = {
  files: [], sort: 'name', path: '',
  selected: null, videoInfo: null, tracks: [],
  currentTab: 'tracks',
  guide: '', guideState: '',
  samples: [],
  config: {},
  history: [], subs: [],
  logs: [],
  activeTask: null, activeFile: '',
  progressTimer: null, logTimer: null, watchTimer: null,
  toastId: 0,
  isDark: false,
  editingGuide: false
};

const ICONS = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M10 8l6 4-6 4V8z"/></svg>',
  srt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  guide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  rss: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  cpu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>',
  film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>',
  sub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>'
};

function $(id) { return document.getElementById(id); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(t) { if(!t) return ''; const d = new Date(t*1000); return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function sizeText(bytes) { if(!bytes) return ''; const u = ['B','KB','MB','GB','TB']; let i=0; while(bytes>=1024 && i<u.length-1){bytes/=1024;i++;} return bytes.toFixed(i?1:0)+' '+u[i]; }
function trackName(t) { return t.title || t.lang || ('Track #'+t.index); }
function toast(msg, type='info') {
  const c = $('toast-container');
  const el = document.createElement('div'); el.className='toast '+type; el.textContent=msg;
  c.appendChild(el); setTimeout(()=>{el.style.opacity='0'; setTimeout(()=>el.remove(),250);}, 3000);
}
function api(url, opts={}) {
  return fetch(url, opts).then(r => { if(!r.ok) return r.text().then(t => { throw new Error(t || r.statusText); }); return r.json(); })
    .catch(e => { toast(e.message, 'error'); throw e; });
}

function toggleTheme() {
  state.isDark = !state.isDark;
  document.body.classList.toggle('dark', state.isDark);
  $('theme-icon').innerHTML = state.isDark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  localStorage.setItem('theme', state.isDark ? 'dark' : 'light');
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  if(saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    state.isDark = true; document.body.classList.add('dark');
  }
}

function toggleFileDrawer() {
  $('file-drawer').classList.toggle('open');
  $('drawer-overlay').classList.toggle('open');
}

function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
}
function openModal(id) { $(id).classList.add('open'); }
function openSettingsModal() { openModal('modal-settings'); }
function openBatchModal() { openModal('modal-batch'); }

function setSort(sort) {
  state.sort = sort; $('sort-name').classList.toggle('active', sort==='name'); $('sort-time').classList.toggle('active', sort==='time'); refreshFiles();
}

function loadPath() { state.path = $('path-input').value; refreshFiles(); }
function refreshFiles() {
  const p = $('path-input').value || state.path;
  api('/api/browse?path='+encodeURIComponent(p)).then(d => {
    state.path = d.path; $('path-input').value = d.path;
    state.files = d.entries || [];
    renderFileList();
  });
}

function renderFileList() {
  const list = $('file-list');
  if(!list) return;
  const items = state.files.slice();
  if(state.sort === 'time') items.sort((a,b)=>b.mtime - a.mtime);
  else items.sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
  let html = '';
  if(state.path !== '/') {
    html += `<div class="f-item" onclick="goUp()">${ICONS.folder}<div class="name">..</div></div>`;
  }
  items.forEach(f => {
    let icon = ICONS.file;
    if(f.is_dir) icon = ICONS.folder;
    else if(f.is_video) icon = ICONS.video;
    else if(f.is_srt) icon = ICONS.srt;
    const sel = state.selected === f.path ? ' sel' : '';
    const tag = f.is_dir ? '' : (f.is_video ? '<span class="badge badge-accent" style="margin-left:8px">视频</span>' : (f.is_srt ? '<span class="badge badge-neutral" style="margin-left:8px">SRT</span>' : ''));
    html += `<div class="f-item${sel}" onclick="selectFile('${esc(f.path)}', ${f.is_dir})">${icon}<div class="name">${esc(f.name)}${tag}</div>${f.mtime ? `<span class="meta">${fmtDate(f.mtime)}</span>` : ''}</div>`;
  });
  list.innerHTML = html || `<div class="empty"><div style="padding:40px 20px; text-align:center; color:var(--text-tertiary)">空文件夹</div></div>`;
}

function goUp() {
  const p = state.path.split('/').filter(Boolean).slice(0,-1).join('/');
  $('path-input').value = '/' + p; loadPath();
}

function selectFile(path, isDir) {
  if(isDir) { $('path-input').value = path; loadPath(); return; }
  state.selected = path;
  state.currentTab = 'tracks';
  state.guide = ''; state.guideState = '';
  state.samples = [];
  renderFileList();
  loadVideoInfo(path);
  toggleFileDrawer();
  renderMain();
}

function loadVideoInfo(path) {
  state.videoInfo = null; state.tracks = [];
  api('/api/video_info?path='+encodeURIComponent(path)).then(d => {
    state.videoInfo = d;
    state.tracks = d.subtitle_tracks || [];
    renderMain();
  });
}

function renderMain() {
  const c = $('main-container');
  if(!state.selected) { renderDashboard(); return; }
  const vi = state.videoInfo || {};
  const selectedTrackTitle = state.tracks.find(t => t.index === vi.selected_track)?.title || (state.tracks[0]?.title || '') || '—';
  c.innerHTML = `
    <div class="editor-header">
      <div>
        <h2>${esc((state.selected||'').split('/').pop()||'未选择')}</h2>
        <p>${vi.title ? esc(vi.title) + ' · ' : ''}轨道: ${esc(selectedTrackTitle)} · ${vi.duration ? Math.round(vi.duration/60)+'分钟' : ''}</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${state.guideState ? `<span class="status-pill active">指南已生成</span>` : ''}
        <button class="btn ${state.activeTask ? 'hidden' : ''}" id="btn-start" onclick="onStartClick()">${ICONS.play}开始翻译</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.currentTab==='tracks'?'active':''}" onclick="switchTab('tracks')">音轨选择</div>
      <div class="tab ${state.currentTab==='guide'?'active':''}" onclick="switchTab('guide')">翻译指南</div>
      <div class="tab ${state.currentTab==='samples'?'active':''}" onclick="switchTab('samples')">样例编辑</div>
      <div class="tab ${state.currentTab==='history'?'active':''}" onclick="switchTab('history')">历史</div>
      <div class="tab ${state.currentTab==='subs'?'active':''}" onclick="switchTab('subs')">订阅</div>
      <div class="tab ${state.currentTab==='stats'?'active':''}" onclick="switchTab('stats')">统计</div>
    </div>
    <div id="tab-content"></div>
  `;
  renderTab();
}

function switchTab(tab) {
  state.currentTab = tab;
  renderMain();
  if(tab==='history') loadHistory();
  if(tab==='subs') loadSubscriptions();
  if(tab==='stats') loadStats();
}

function renderTab() {
  const tc = $('tab-content'); if(!tc) return;
  if(state.currentTab === 'tracks') renderTracks(tc);
  else if(state.currentTab === 'guide') renderGuide(tc);
  else if(state.currentTab === 'samples') renderSamples(tc);
  else if(state.currentTab === 'history') renderHistory(tc);
  else if(state.currentTab === 'subs') renderSubs(tc);
  else if(state.currentTab === 'stats') renderStats(tc);
}

function renderTracks(el) {
  if(state.activeTask && state.activeFile === state.selected) {
    const pct = Math.round(state.activeTask.progress || 0);
    const r = 28, c = 2 * Math.PI * r, off = c - (pct/100) * c;
    el.innerHTML = `
      <div class="card progress-block">
        <svg class="progress-ring" viewBox="0 0 64 64">
          <circle class="bg" cx="32" cy="32" r="${r}"></circle>
          <circle class="fg" cx="32" cy="32" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
        </svg>
        <div class="progress-info">
          <h4>${esc(state.activeTask.stage || '翻译中')}</h4>
          <p>${pct}% · ${esc(state.activeTask.detail || '')}</p>
        </div>
      </div>`;
    return;
  }
  const tracks = state.tracks.length ? state.tracks : [{index:0, lang:'未知', title:'未检测到字幕轨', type:'未知'}];
  let html = '<div class="card" style="padding:8px 0">';
  tracks.forEach((t, i) => {
    const rec = (!t.is_srt && (t.is_forced || t.type === 'hearing_impaired'));
    html += `
      <div class="track-card ${i===0?'selected':''}" onclick="selectTrack(${t.index})">
        <span class="lang">${esc(t.lang || '---')}</span>
        <span class="title">${esc(t.title || ('Track #'+t.index))}</span>
        <span class="idx">#${t.index}</span>
        ${t.is_srt ? '<span class="badge badge-neutral">SRT</span>' : '<span class="badge badge-accent">MKV</span>'}
        ${rec ? '<span class="badge badge-neutral" style="margin-left:6px">推荐</span>' : ''}
      </div>`;
  });
  html += '</div>';
  html += `<div class="mt-16" style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="onStartClick()">${ICONS.play}开始翻译</button>
    <button class="btn" onclick="selectTrack()">${ICONS.sub}自动选择</button>
  </div>`;
  el.innerHTML = html;
}

function selectTrack(idx) {
  if(idx === undefined) { toast('自动选择推荐轨道', 'info'); return; }
  toast('已选择轨道 #' + idx, 'info');
}

function renderGuide(el) {
  if(!state.guide) {
    el.innerHTML = `
      <div class="card guide-empty">
        <div class="big">${ICONS.guide}</div>
        <h3>暂无翻译指南</h3>
        <p>开始翻译后系统会自动生成风格指南，或点击下方按钮预先创建。</p>
        <button class="btn btn-primary mt-16" onclick="generateGuide()">${ICONS.guide}生成指南</button>
      </div>`;
    return;
  }
  if(state.editingGuide) {
    el.innerHTML = `
      <div class="card">
        <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center">
          <h3>编辑指南</h3>
          <div class="flex gap-8">
            <button class="btn" onclick="cancelGuideEdit()">取消</button>
            <button class="btn btn-primary" onclick="saveGuide()">保存</button>
          </div>
        </div>
        <textarea id="guide-editor" style="width:100%;min-height:360px;border:none;border-top:1px solid var(--border);padding:18px;background:var(--surface-raised);color:var(--text);font-size:14px;line-height:1.9;outline:none;resize:vertical">${esc(state.guide)}</textarea>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="card">
        <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center">
          <h3>翻译指南</h3>
          <div class="flex gap-8">
            <button class="btn" onclick="generateGuide()">${ICONS.refresh}重新生成</button>
            <button class="btn btn-primary" onclick="editGuide()">${ICONS.edit}编辑</button>
          </div>
        </div>
        <div class="card-pad guide-box">${esc(state.guide).replace(/\n/g,'<br>')}</div>
      </div>`;
  }
}

function editGuide() { state.editingGuide = true; renderTab(); }
function cancelGuideEdit() { state.editingGuide = false; renderTab(); }
function saveGuide() { state.guide = $('guide-editor').value; state.editingGuide = false; toast('指南已保存', 'success'); renderTab(); }
function generateGuide() {
  if(!state.selected) { toast('请先选择视频', 'warning'); return; }
  toast('正在生成指南...', 'info');
  api('/api/guide?path='+encodeURIComponent(state.selected)+'&force=true').then(d => {
    state.guide = d.guide || ''; state.guideState = 'ok'; renderTab(); toast('指南已生成', 'success');
  });
}

function renderSamples(el) {
  if(!state.samples.length) {
    el.innerHTML = `
      <div class="card guide-empty">
        <div class="big">${ICONS.sub}</div>
        <h3>暂无样例</h3>
        <p>选择字幕轨后点击“开始翻译”，等待第一批样例完成即可在此微调。</p>
      </div>`;
    return;
  }
  let html = `<div class="card" style="overflow:hidden">
    <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)">
      <span>样例编辑器 · ${state.samples.length} 条</span>
      <div class="flex gap-8">
        <button class="btn" onclick="regenerateSamples()">${ICONS.refresh}重新生成</button>
        <button class="btn btn-primary" onclick="saveSamples()">${ICONS.check}保存修改</button>
      </div>
    </div>
    <div class="sample-row" style="background:var(--surface-raised);font-weight:600;color:var(--text-secondary);font-size:12px;padding:10px 16px">
      <div class="idx">#</div>
      <div>原文</div>
      <div>译文</div>
      <div class="acts"></div>
    </div>`;
  state.samples.forEach((s, i) => {
    html += `<div class="sample-row">
      <div class="idx">${i+1}</div>
      <div class="src">${esc(s.source)}</div>
      <div class="dst"><textarea id="sample-${i}">${esc(s.target)}</textarea></div>
      <div class="acts">
        <button title="重置" onclick="resetSample(${i})">${ICONS.refresh}</button>
        <button title="删除" onclick="removeSample(${i})">${ICONS.trash}</button>
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function resetSample(i) { state.samples[i].target = state.samples[i].source; renderTab(); }
function removeSample(i) { state.samples.splice(i, 1); renderTab(); }
function saveSamples() {
  state.samples.forEach((s, i) => { const el = $('sample-'+i); if(el) s.target = el.value; });
  toast('样例已保存', 'success');
}
function regenerateSamples() { toast('正在重新生成样例...', 'info'); }

function renderHistory(el) {
  if(!state.history.length) {
    el.innerHTML = `<div class="card guide-empty"><div class="big">${ICONS.history}</div><h3>暂无历史</h3></div>`;
    return;
  }
  let html = '<div class="card">';
  state.history.forEach(h => {
    html += `<div class="list-item">
      <div class="icon">${ICONS.video}</div>
      <div class="body">
        <div class="title">${esc(h.video_path.split('/').pop())}</div>
        <div class="meta">${esc(h.target_lang)} · ${fmtDate(h.finished_at)} · ${h.srt_path||''}</div>
      </div>
      <div class="actions"><button class="btn" onclick="selectFile('${esc(h.video_path)}', false)">打开</button></div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderSubs(el) {
  if(!state.subs.length) {
    el.innerHTML = `<div class="card guide-empty"><div class="big">${ICONS.rss}</div><h3>暂无订阅</h3><p>监听目录新片源后自动翻译。</p></div>`;
    return;
  }
  let html = '<div class="card">';
  state.subs.forEach(s => {
    html += `<div class="list-item">
      <div class="icon">${ICONS.rss}</div>
      <div class="body">
        <div class="title">${esc(s.path)}</div>
        <div class="meta">${s.recursive ? '递归' : '非递归'} · 语言: ${esc(s.target_lang||'默认')}</div>
      </div>
      <div class="actions"><button class="btn" onclick="unsubscribe('${esc(s.path)}')">${ICONS.trash}</button></div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderStats(el) {
  el.innerHTML = `
    <div class="stat-grid mt-16">
      <div class="stat-card"><div class="label">总翻译次数</div><div class="value">${state.stats?.total || 0}</div></div>
      <div class="stat-card"><div class="label">成功</div><div class="value" style="color:var(--success)">${state.stats?.success || 0}</div></div>
      <div class="stat-card"><div class="label">失败</div><div class="value" style="color:var(--error)">${state.stats?.failed || 0}</div></div>
      <div class="stat-card"><div class="label">距离上次</div><div class="value" style="font-size:18px;line-height:1.4">${state.stats?.last_time ? fmtDate(state.stats.last_time) : '-'}</div></div>
    </div>
    <div class="card mt-16" style="padding:0;overflow:hidden">
      <div class="card-pad" style="border-bottom:1px solid var(--border)"><h3>近期活动</h3></div>
      <div class="log-panel" id="log-panel"></div>
    </div>
  `;
  renderLogs();
}

function renderLogs() {
  const p = $('log-panel'); if(p) p.innerHTML = state.logs.length ? state.logs.map(l => `<span style="color:${l.type==='error'?'var(--error)':l.type==='success'?'var(--success)':'var(--text-secondary)'}">${esc(l.text)}</span>`).join('\n') : '<span style="color:var(--text-tertiary)">暂无日志</span>';
}

function renderDashboard() {
  const c = $('main-container');
  const status = state.activeTask ? `翻译进度 ${Math.round(state.activeTask.progress||0)}%` : '准备就绪';
  c.innerHTML = `
    <div class="dashboard-grid">
      <div class="card span-8">
        <div class="card-pad hero">
          <div class="hero-text">
            <h2>${status}</h2>
            <p>选择视频或字幕文件开始翻译，或使用批量、订阅自动化工作流。</p>
          </div>
          <div class="hero-action">
            <button class="btn btn-primary" onclick="toggleFileDrawer()">${ICONS.folder}选择文件</button>
            <button class="btn" onclick="openBatchModal()">${ICONS.film}批量翻译</button>
          </div>
        </div>
      </div>
      <div class="card span-4">
        <div class="card-pad">
          <h3>快捷操作</h3>
          <div class="quick-actions">
            <div class="qa-item" onclick="openSettingsModal()">
              <div class="icon">${ICONS.guide}</div>
              <strong>设置</strong>
              <span>API、模型、通知</span>
            </div>
            <div class="qa-item" onclick="toggleTheme()">
              <div class="icon">${ICONS.film}</div>
              <strong>切换主题</strong>
              <span>明亮或深色</span>
            </div>
            <div class="qa-item" onclick="loadSubscriptions()">
              <div class="icon">${ICONS.rss}</div>
              <strong>管理订阅</strong>
              <span>自动翻译监听</span>
            </div>
          </div>
        </div>
      </div>
      <div class="card span-6">
        <div class="card-pad">
          <h3>最近翻译</h3>
          <div id="dash-history">
            <div class="empty" style="padding:30px 0"><p style="color:var(--text-tertiary)">暂无记录</p></div>
          </div>
        </div>
      </div>
      <div class="card span-6">
        <div class="card-pad">
          <h3>订阅监听</h3>
          <div id="dash-subs">
            <div class="empty" style="padding:30px 0"><p style="color:var(--text-tertiary)">暂无订阅</p></div>
          </div>
        </div>
      </div>
    </div>
  `;
  renderDashHistory();
  renderDashSubs();
}

function renderDashHistory() {
  const el = $('dash-history'); if(!el) return;
  if(!state.history.length) return;
  el.innerHTML = state.history.slice(0,5).map(h => `<div class="list-item"><div class="icon">${ICONS.video}</div><div class="body"><div class="title">${esc(h.video_path.split('/').pop())}</div><div class="meta">${esc(h.target_lang)} · ${fmtDate(h.finished_at)}</div></div></div>`).join('');
}
function renderDashSubs() {
  const el = $('dash-subs'); if(!el) return;
  if(!state.subs.length) return;
  el.innerHTML = state.subs.map(s => `<div class="list-item"><div class="icon">${ICONS.rss}</div><div class="body"><div class="title">${esc(s.path)}</div><div class="meta">${s.recursive ? '递归' : '非递归'}</div></div></div>`).join('');
}

function onStartClick() {
  if(!state.selected) { toast('请先选择视频', 'warning'); return; }
  const targetLang = 'zh';
  toast('开始翻译...', 'info');
  api('/api/translate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:state.selected, target_lang:targetLang, overwrite:true})
  }).then(d => {
    state.activeTask = d; state.activeFile = state.selected;
    toast('翻译已开始', 'success');
    renderMain();
    startProgressWatch();
  });
}

function startProgressWatch() {
  if(state.progressTimer) clearInterval(state.progressTimer);
  state.progressTimer = setInterval(() => {
    api('/api/progress').then(d => {
      if(!d.active) {
        clearInterval(state.progressTimer); state.progressTimer = null;
        state.activeTask = null; state.activeFile = '';
        toast('翻译完成', 'success');
        loadHistory();
      } else {
        state.activeTask = d;
        state.activeFile = d.video_path || state.activeFile;
        if(state.selected === state.activeFile) renderMain();
      }
    }).catch(()=>{ clearInterval(state.progressTimer); state.progressTimer=null; });
  }, 1000);
}

function loadHistory() {
  api('/api/history').then(d => { state.history = d.history || []; if(!state.selected) renderDashboard(); renderDashHistory(); if(state.selected && state.currentTab==='history') renderTab(); });
}
function loadStats() {
  api('/api/stats').then(d => { state.stats = d; if(state.currentTab==='stats') renderTab(); });
}
function loadSubscriptions() {
  api('/api/subscriptions').then(d => { state.subs = d.subscriptions || []; if(!state.selected) renderDashboard(); renderDashSubs(); if(state.selected && state.currentTab==='subs') renderTab(); });
}
function unsubscribe(p) {
  api('/api/unsubscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:p})}).then(() => {
    toast('已取消订阅', 'success'); loadSubscriptions();
  });
}

function openSettingsModal() {
  api('/api/config').then(c => {
    state.config = c;
    $('s-base-url').value = c.base_url || '';
    $('s-api-key').value = c.api_key || '';
    $('s-model').value = c.model || '';
    $('s-context-model').value = c.context_model || '';
    $('s-batch-size').value = c.batch_size || 12;
    $('s-webhook-url').value = c.webhook_url || '';
    $('s-webhook-type').value = c.webhook_type || 'weecom';
    $('s-use-context').checked = c.use_context || false;
    $('s-auto-cleanup').checked = c.auto_cleanup || false;
    $('s-bilingual').checked = c.bilingual || false;
    openModal('modal-settings');
  });
}
function saveSettings() {
  const cfg = {
    base_url: $('s-base-url').value,
    api_key: $('s-api-key').value,
    model: $('s-model').value,
    context_model: $('s-context-model').value,
    batch_size: parseInt($('s-batch-size').value) || 12,
    webhook_url: $('s-webhook-url').value,
    webhook_type: $('s-webhook-type').value,
    use_context: $('s-use-context').checked,
    auto_cleanup: $('s-auto-cleanup').checked,
    bilingual: $('s-bilingual').checked
  };
  api('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cfg)}).then(() => {
    toast('设置已保存', 'success'); closeModals();
  });
}

function submitBatch() {
  const lines = $('batch-input').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(!lines.length) { toast('请输入至少一个路径', 'warning'); return; }
  const data = { paths: lines, target_lang: $('batch-lang').value || 'zh', overwrite: $('batch-overwrite').checked };
  api('/api/batch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(() => {
    toast('批量任务已提交', 'success'); closeModals(); startProgressWatch();
  });
}

function pollLogs() {
  api('/api/logs').then(d => {
    state.logs = (d.logs || []).slice(-100);
    renderLogs();
  });
}

function init() {
  initTheme();
  refreshFiles();
  loadHistory();
  loadSubscriptions();
  loadStats();
  setInterval(pollLogs, 2000);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModals(); });
  $('path-input').addEventListener('keydown', e => { if(e.key === 'Enter') loadPath(); });
}
init();
</script>
</body>
</html>

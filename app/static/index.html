<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<title>Subtitle Translator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">
  <!-- ═══ 侧边栏 ═══ -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-logo"><img src="/icon_256.png" alt="字幕翻译器"></div>
      <div>
        <h1>字幕翻译器</h1>
        <div class="desc">AI 字幕 · 风格指南 · 批量处理</div>
      </div>
    </div>

    <div class="sb-path">
      <div class="inp-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <input type="text" id="path-inp" placeholder="输入路径后按回车或点加载..." onkeydown="if(event.key==='Enter')loadPath()">
      </div>
    </div>

    <div class="sb-actions">
      <button class="btn" onclick="loadPath()">加载</button>
      <button class="btn" onclick="openBatch()">批量</button>
      <button class="btn primary" id="btn-start" disabled onclick="startTranslate()">翻译</button>
    </div>

    <div class="sort-bar">
      <span class="lbl">排序</span>
      <button class="sort-btn active" data-s="name" onclick="sortBrowse('name')">A-Z</button>
      <button class="sort-btn" data-s="time" onclick="sortBrowse('time')">时间</button>
    </div>

    <div class="file-list" id="file-list">
      <div class="empty"><div class="icon-box">…</div><p>加载中</p></div>
    </div>

    <div class="sb-foot">
      <button class="foot-btn" onclick="openSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
      <div class="spacer"></div>
      <button class="foot-btn" onclick="toggleTheme()" title="切换亮/暗主题">
        <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="status-dot" id="status-dot"></div>
    </div>
  </aside>

  <!-- ═══ 主区域 ═══ -->
  <main class="main">
    <header class="m-head">
      <div style="min-width:0">
        <h2 id="main-title">选择视频文件</h2>
        <div class="sub" id="main-sub">左侧浏览目录或输入路径</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-shrink:0">
        <label class="ctx-toggle" title="翻译完成后自动生成双语字幕（.bilingual.srt）">
          <input type="checkbox" id="bilingual-switch" onchange="toggleBilingual()"><span class="track"></span>双语
        </label>
        <label class="ctx-toggle" title="启用上下文感知翻译（传入前后字幕作为语境）">
          <input type="checkbox" id="ctx-switch" onchange="toggleContext()"><span class="track"></span>上下文
        </label>
      </div>
    </header>

    <nav class="tabs">
      <div class="tab active" data-tab="tracks" onclick="switchTab('tracks')">字幕轨</div>
      <div class="tab" data-tab="guide" onclick="switchTab('guide')">指南</div>
      <div class="tab" data-tab="samples" onclick="switchTab('samples')">样例</div>
      <div class="tab" data-tab="history" onclick="switchTab('history')">历史</div>
      <div class="tab" data-tab="watch" onclick="switchTab('watch')">订阅</div>
    </nav>

    <div class="content">
      <div class="panel active" id="panel-tracks">
        <div class="empty">
          <div class="icon-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          </div>
          <h3>选择视频文件</h3>
          <p>在左侧浏览目录或输入路径</p>
        </div>
      </div>

      <div class="panel" id="panel-guide">
        <div class="empty">
          <div class="icon-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>
          </div>
          <h3>翻译指南</h3>
          <p id="guide-empty-msg">选择视频后可手动生成指南</p>
          <button id="btn-gen-guide" class="btn" style="display:none;margin-top:16px;border-color:var(--accent);color:var(--accent)" onclick="generateGuideManual()">生成指南</button>
        </div>
      </div>

      <div class="panel" id="panel-samples">
        <div class="empty">
          <div class="icon-box">✨</div>
          <h3>翻译样例</h3>
          <p>翻译完成后展示质量对比</p>
        </div>
      </div>

      <div class="panel" id="panel-history">
        <div class="empty">
          <div class="icon-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <h3>翻译历史</h3>
          <p>暂无记录</p>
        </div>
      </div>

      <div class="panel" id="panel-watch">
        <div class="empty">
          <div class="icon-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <h3>订阅文件夹</h3>
          <p>自动检测新集数并翻译</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ═══ 设置模态框 ═══ -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>API 设置</h2>
    <div class="modal-sub">配置翻译与分析模型、批量参数与通知</div>
    <div class="field"><label for="cfg-key">API Key</label><input type="password" id="cfg-key"></div>
    <div class="field"><label for="cfg-url">Base URL</label><input type="text" id="cfg-url"></div>
    <div class="field"><label for="cfg-cmodel">分析模型（生成指南）</label><input type="text" id="cfg-cmodel"></div>
    <div class="field"><label for="cfg-model">翻译模型（批量翻译）</label><input type="text" id="cfg-model"></div>
    <div class="field"><label for="cfg-batch">每批条数</label><input type="number" id="cfg-batch" min="5" max="30"></div>
    <div class="field">
      <label class="ctx-toggle bi-field-row" for="cfg-bilingual">
        <span>翻译时直接输出双语字幕</span>
        <input type="checkbox" id="cfg-bilingual"><span class="track"></span>
      </label>
      <div style="font-size:11px;color:var(--text-4);margin-top:4px">完成后自动生成 .bilingual.srt（原文+译文）；源已是双语则自动拆分为中文字幕+双语字幕</div>
    </div>
    <div class="field">
      <label for="cfg-bilingual-layout">双语字幕行序</label>
      <select id="cfg-bilingual-layout">
        <option value="orig_first">原文在上（英上中下）</option>
        <option value="trans_first">译文在上（中上英下）</option>
      </select>
    </div>
    <div class="field">
      <label for="cfg-webhook">通知 Webhook URL（企业微信/钉钉）</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="cfg-webhook" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..." style="flex:1">
        <button class="btn sm" style="border-color:var(--accent);color:var(--accent);flex-shrink:0" onclick="testWebhook()">测试通知</button>
      </div>
    </div>
    <div class="field">
      <label for="cfg-webhook-type">通知类型</label>
      <select id="cfg-webhook-type">
        <option value="wecom">企业微信机器人</option>
        <option value="dingtalk">钉钉机器人</option>
        <option value="generic">通用（JSON POST）</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
    <div class="msg" id="settings-msg"></div>
  </div>
</div>

<!-- ═══ 批量模态框 ═══ -->
<div class="modal-overlay" id="batch-modal">
  <div class="modal">
    <h2>批量翻译</h2>
    <div class="modal-sub">扫描文件夹中的所有视频，自动跳过已翻译的</div>
    <div class="field">
      <label>文件夹路径</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="batch-path" style="flex:1">
        <button class="btn primary sm" onclick="scanBatch()">扫描</button>
      </div>
    </div>
    <div id="batch-track-selector" style="font-size:11.5px;color:var(--text-3);margin-top:4px"></div>
    <div class="batch-list" id="batch-list"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn" onclick="closeBatch()">关闭</button>
      <button class="btn primary" id="batch-go" onclick="startBatch()" disabled>开始批量翻译</button>
    </div>
    <div class="msg" id="batch-msg"></div>
  </div>
</div>

<button id="btn-top" onclick="scrollToTop()" title="返回顶部">↑</button>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="/static/app.js"></script>
</body>
</html>
